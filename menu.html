<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Big Best Bites Restaurant - Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav>
      <h1>Big Best Bites Restaurant</h1>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html" class="active">Menu</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="feedback.html">Feedback</a></li>
        <li><a href="#" id="view-cart-btn">View Cart(<span id="cart-count">0</span>)</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="menu-section" class="menu">
      <h2>Our Delicious Menu</h2>
      <div class="menu-items-grid" id="menu-items-container">
        <!-- Menu items populated by JS -->
      </div>
    </section>

    <section id="cart-display" class="cart-section" style="display:none;">
      <button id="close-cart-btn" title="Close Cart">X</button>
      <h2>Your Cart</h2>
      <ul id="cart-list"></ul>
      <p>Total: N$ <span id="cart-total">0.00</span></p>
      <button class="btn" id="checkout-btn">Proceed to Checkout</button>
    </section>
  </main>

  <footer>
    <p>&copy;2025 Big Best Bites Restaurant. All rights reserved.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuItemsContainer = document.getElementById('menu-items-container');
      const cartCountSpan = document.getElementById('cart-count');
      const cartList = document.getElementById('cart-list');
      const cartTotalSpan = document.getElementById('cart-total');
      const viewCartBtn = document.getElementById('view-cart-btn');
      const closeCartBtn = document.getElementById('close-cart-btn');
      const cartDisplaySection = document.getElementById('cart-display');
      const checkoutBtn = document.getElementById('checkout-btn');

      let cart = [];

      const menu = [
    { id: 1, name: 'Classic Burger', description: 'Beef patty, lettuce, tomato, cheese, special sauce.', price: 95.00, image: 'hamburger.png' },
    { id: 2, name: 'Margherita Pizza', description: 'Tomato, mozzarella, basil.', price: 120.00, image: 'margherita.pizza.png' },
    { id: 3, name: 'Chicken Pasta', description: 'Creamy chicken pasta with mushrooms.', price: 110.00, image: 'OIP.webp' },
    { id: 4, name: 'Fresh Salad', description: 'Mixed greens, cherry tomatoes, cucumber, vinaigrette.', price: 70.00, image: 'download.webp' },
    { id: 5, name: 'Soft Drink', description: 'Variety of soft drinks.', price: 20.00, image: 'download.jpeg' },
    { id: 6, name: 'Chocolate Brownie', description: 'Warm brownie with vanilla ice cream.', price: 45.00, image: 'chocolate.brownie.png' },
      ];

      function renderMenuItems() {
        menuItemsContainer.innerHTML = '';
        menu.forEach(item => {
          const menuItemDiv = document.createElement('div');
          menuItemDiv.classList.add('menu-item');
          menuItemDiv.innerHTML = `
            <img src="${item.image}" alt="${item.name}">
            <h3>${item.name}</h3>
            <p>${item.description}</p>
            <div class="price">N$ ${item.price.toFixed(2)}</div>
            <button class="btn add-to-cart-btn" data-id="${item.id}">Add to Cart</button>
          `;
          menuItemsContainer.appendChild(menuItemDiv);
        });

        document.querySelectorAll('.add-to-cart-btn').forEach(button => {
          button.addEventListener('click', (event) => {
            const itemId = parseInt(event.target.dataset.id);
            addToCart(itemId);
          });
        });
      }

      function addToCart(itemId) {
        const existingItem = cart.find(item => item.id === itemId);
        if (existingItem) {
          existingItem.quantity++;
        } else {
          const itemToAdd = menu.find(item => item.id === itemId);
          if (itemToAdd) {
            cart.push({ ...itemToAdd, quantity: 1 });
          }
        }
        updateCartDisplay();
      }

      function removeFromCart(itemId) {
        cart = cart.filter(item => item.id !== itemId);
        updateCartDisplay();
      }

      function updateCartDisplay() {
        cartCountSpan.textContent = cart.reduce((total, item) => total + item.quantity, 0);
        cartList.innerHTML = '';
        let total = 0;

        if (cart.length === 0) {
          cartList.innerHTML = '<li style="text-align: center; color: #888;">Your cart is empty.</li>';
        } else {
          cart.forEach(item => {
            const listItem = document.createElement('li');
            listItem.innerHTML = `
              <div class="item-details">
                ${item.name} (x${item.quantity}) - N$ ${(item.price * item.quantity).toFixed(2)}
              </div>
              <button class="remove-item-btn" data-id="${item.id}">Remove</button>
            `;
            cartList.appendChild(listItem);
            total += item.price * item.quantity;
          });
        }

        cartTotalSpan.textContent = total.toFixed(2);

        document.querySelectorAll('.remove-item-btn').forEach(button => {
          button.addEventListener('click', (event) => {
            const itemId = parseInt(event.target.dataset.id);
            removeFromCart(itemId);
          });
        });
      }

      viewCartBtn.addEventListener('click', (e) => {
        e.preventDefault();
        cartDisplaySection.style.display = 'block';
        cartDisplaySection.scrollIntoView({ behavior: 'smooth' });
      });

      closeCartBtn.addEventListener('click', () => {
        cartDisplaySection.style.display = 'none';
      });

    checkoutBtn.addEventListener('click', async () => {
        if (cart.length === 0) {
            alert('Your cart is empty!');
            return;
        }

        const orderData = {
            total: parseFloat(cartTotalSpan.textContent),
            cart: cart
        };

        try {
            const response = await fetch('process_order.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            });

            const result = await response.json();
            
            if (result.success) {
                alert(`Order #${result.order_id} placed successfully!\nTotal: N$ ${orderData.total.toFixed(2)}`);
                cart = [];
                updateCartDisplay();
                cartDisplaySection.style.display = 'none';
            } else {
                alert(result.message);
            }
        } catch (error) {
            alert("An error occurred while processing your order.");
        }
      });  

      renderMenuItems();
      updateCartDisplay();
    });
  </script>
</body>
</html>
